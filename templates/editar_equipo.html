{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">✏️ Editar Equipo: {{ equipo.serial }}</h4>
            </div>
            <div class="card-body">
                
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Serial (*)</label>
                            <input type="text" name="serial" class="form-control" value="{{ equipo.serial }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Marca</label>
                            <input type="text" name="marca" class="form-control" value="{{ equipo.marca or '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Modelo</label>
                            <input type="text" name="modelo" class="form-control" value="{{ equipo.modelo or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Categoría (*)</label>
                            <select name="categoria" class="form-select" required>
                                {% for cat in categorias %}
                                    <option value="{{ cat.id_categoria }}" {% if cat.id_categoria == equipo.id_categoria %}selected{% endif %}>
                                        {{ cat.nombre }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Departamento</label>
                            <select name="departamento" class="form-select">
                                <option value="">-- Sin Asignar --</option>
                                {% for dpto in departamentos %}
                                    <option value="{{ dpto.id_dpto }}" {% if dpto.id_dpto == equipo.id_dpto %}selected{% endif %}>
                                        {{ dpto.nombre }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Estado</label>
                            <select name="estado" class="form-select">
                                {% for est in estados %}
                                    <option value="{{ est }}" {% if est == equipo.estado_operativo %}selected{% endif %}>
                                        {{ est | capitalize }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Fecha de Compra</label>
                        <input type="date" name="fecha_compra" class="form-control" value="{{ equipo.fecha_compra.strftime('%Y-%m-%d') if equipo.fecha_compra else '' }}">
                    </div>

                    <div class="d-flex justify-content-end">
                        <a href="{{ url_for('inventario.listar_equipos') }}" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-warning px-4">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
