{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">➕ Registrar Nuevo Equipo</h4>
            </div>
            <div class="card-body">
                
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Serial (*)</label>
                            <input type="text" name="serial" class="form-control" required placeholder="Ej: SN-12345">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Marca</label>
                            <input type="text" name="marca" class="form-control" placeholder="Ej: Dell">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Modelo</label>
                            <input type="text" name="modelo" class="form-control" placeholder="Ej: Latitude 5420">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Categoría (*)</label>
                            <select name="categoria" class="form-select" required>
                                <option value="" selected disabled>Seleccione...</option>
                                {% for cat in categorias %}
                                    <option value="{{ cat.id_categoria }}">{{ cat.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Departamento</label>
                            <select name="departamento" class="form-select">
                                <option value="">-- Sin Asignar --</option>
                                {% for dpto in departamentos %}
                                    <option value="{{ dpto.id_dpto }}">{{ dpto.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Estado</label>
                            <select name="estado" class="form-select">
                                {% for est in estados %}
                                    <option value="{{ est }}">{{ est | capitalize }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Fecha de Compra</label>
                        <input type="date" name="fecha_compra" class="form-control">
                    </div>

                    <div class="d-flex justify-content-end">
                        <a href="{{ url_for('inventario.listar_equipos') }}" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success px-4">Guardar Equipo</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
