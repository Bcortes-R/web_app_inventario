{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h3> Departamentos </h3>
    <a href="{{ url_for('parametros.crear_departamento') }}" class="btn btn-primary">➕ Nuevo</a>
</div>
<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>Nombre</th><th class="text-end">Acciones</th></tr></thead>
            <tbody>
                {% for d in departamentos %}
                <tr>
                    <td>{{ d.nombre }}</td>
                    <td class="text-end">
                        <a href="{{ url_for('parametros.editar_departamento', id=d.id_dpto) }}" class="btn btn-sm btn-warning">✏️</a>
                        <form action="{{ url_for('parametros.eliminar_departamento', id=d.id_dpto) }}" method="POST" style="display:inline" onsubmit="return confirm('¿Eliminar?');">
                            <button class="btn btn-sm btn-danger">🗑️</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
